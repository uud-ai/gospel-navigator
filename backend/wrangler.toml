name = "blagovest-chat"
main = "worker.js"
compatibility_date = "2024-01-01"

# Необязательная переменная — модель чата. Секреты (APP_TOKEN, PROXY_API_KEY)
# задаются отдельно через `wrangler secret put`, не здесь (не попадают в git).
[vars]
CHAT_MODEL = "gpt-4o-mini"

# R2-бакет с data/*.json (bible.json, commentaries.json и *_embeddings.json).
# Создаётся отдельно: `wrangler r2 bucket create <bucket-name>`.
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "blagovest-data"
